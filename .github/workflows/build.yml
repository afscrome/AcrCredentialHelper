name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    uses: ./.github/workflows/dotnet-build-test.yml
    with:
      runs-on: ${{ matrix.runner }}
      artifact-prefix: ${{ matrix.rid }}-
      solution-path: AcrCredentialHelper.slnx

  msix:
    name: Package MSIX
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          sparse-checkout: packaging

      - name: 📥 Download Windows publish output
        uses: actions/download-artifact@v8
        with:
          pattern: win-*-PublishArtifacts
          path: ${{ github.workspace }}/publish

      - name: ⚙️ Setup winapp CLI
        uses: microsoft/setup-WinAppCli@v0.1

      - name: 📦 Package
        shell: pwsh
        run: ./packaging/pack-msix.ps1 -Version 1.0.${{ github.run_number }}.0

      - name: 📤 Upload MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: MsixBundle
          path: ${{ github.workspace }}/artifacts/msix
          if-no-files-found: error
          retention-days: ${{ github.ref_name == github.event.repository.default_branch && 90 || 7 }}
