name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    uses: ./.github/workflows/dotnet-build-test.yml
    with:
      runs-on: ${{ matrix.runner }}
      artifact-prefix: ${{ matrix.rid }}-
      solution-path: AcrCredentialHelper.slnx
